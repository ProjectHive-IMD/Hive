[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "prague"        # Robinhood Chain (ArbOS): Cancun/Prague opcodes
optimizer = true
optimizer_runs = 800
via_ir = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 64
